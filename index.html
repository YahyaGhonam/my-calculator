<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yahya Ghonem | Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(ellipse at top, #243b65 0%, transparent 55%),
        linear-gradient(145deg, #080d19, #111827 70%, #10172b);
    }

    .calculator {
      width: 100%;
      max-width: 370px;
      padding: 25px;
      border: 1px solid #ffffff20;
      border-radius: 28px;
      background: #151d2fe8;
      box-shadow: 0 25px 70px #0008;
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(16px, 5vw, 21px);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .brand span {
      color: #8b9bb8;
      font-size: 10px;
      text-align: left;
    }

    .display {
      min-height: 125px;
      padding: 18px 14px;
      margin-bottom: 18px;
      border-radius: 18px;
      background: #0b1220;
      border: 1px solid #ffffff0c;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
    }

    #history {
      min-height: 24px;
      color: #94a3b8;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #screen {
      width: 100%;
      text-align: left;
      direction: ltr;
      font-size: clamp(30px, 9vw, 42px);
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      min-width: 0;
      min-height: 59px;
      border: 1px solid #ffffff08;
      border-radius: 16px;
      background: #263249;
      color: #f8fafc;
      font: inherit;
      font-size: 20px;
      cursor: pointer;
      transition: transform .12s, background .12s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: #35445e;
    }

    button:active {
      transform: scale(.94);
    }

    .utility {
      color: #8be9fd;
      background: #1d3046;
    }

    .operator {
      color: #c4b5fd;
      background: #302a50;
    }

    .equals {
      color: #07121d;
      background: linear-gradient(135deg, #67e8f9, #60a5fa);
      font-weight: 800;
    }

    .equals:hover {
      background: linear-gradient(135deg, #a5f3fc, #93c5fd);
    }

    .zero {
      grid-column: span 2;
    }

    .footer {
      text-align: center;
      margin-top: 19px;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 400px) {
      .calculator {
        padding: 18px;
      }

      .keys {
        gap: 8px;
      }

      button {
        min-height: 54px;
      }
    }
  </style>
</head>

<body>
  <main class="calculator">

    <header class="brand">
      <h1>Yahya Ghonem</h1>
      <span>SMART CALCULATOR</span>
    </header>

    <section class="display" aria-live="polite">
      <div id="history">جاهز للحساب</div>
      <div id="screen">0</div>
    </section>

    <section class="keys" aria-label="أزرار الآلة الحاسبة">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="delete">⌫</button>
      <button class="utility" data-action="percent">%</button>
      <button class="operator" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="operator" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="operator" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="operator" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>

    <footer class="footer">
      Made with care · Yahya Ghonem
    </footer>

  </main>

  <script>
    const screen = document.getElementById("screen");
    const history = document.getElementById("history");

    let current = "0";
    let stored = null;
    let operator = null;
    let fresh = false;

    function show() {
      screen.textContent = current;
    }

    function number(value) {
      if (fresh || current === "خطأ") {
        current = value;
        fresh = false;
      } else if (current === "0") {
        current = value;
      } else if (current.length < 15) {
        current += value;
      }

      show();
    }

    function calculate(a, b, op) {
      if (op === "+") return a + b;
      if (op === "-") return a - b;
      if (op === "*") return a * b;
      if (op === "/") return b === 0 ? null : a / b;
      return b;
    }

    function clean(value) {
      if (value === null || !Number.isFinite(value)) {
        return null;
      }

      return String(Number(value.toPrecision(12)));
    }

    function chooseOperator(op) {
      if (current === "خطأ") return;

      const value = Number(current);

      if (operator && !fresh) {
        const result = calculate(stored, value, operator);
        const formatted = clean(result);

        if (formatted === null) {
          current = "خطأ";
          stored = null;
          operator = null;
          fresh = true;
          history.textContent = "لا يمكن القسمة على صفر";
          show();
          return;
        }

        current = formatted;
      }

      stored = Number(current);
      operator = op;
      fresh = true;
      history.textContent = `${current} ${op}`;
      show();
    }

    function equals() {
      if (operator === null || stored === null || fresh) return;

      const a = stored;
      const b = Number(current);
      const op = operator;
      const result = calculate(a, b, op);
      const formatted = clean(result);

      history.textContent = `${a} ${op} ${b} =`;
      current = formatted ?? "خطأ";
      stored = null;
      operator = null;
      fresh = true;
      show();
    }

    function clearAll() {
      current = "0";
      stored = null;
      operator = null;
      fresh = false;
      history.textContent = "جاهز للحساب";
      show();
    }

    function removeLast() {
      if (fresh || current === "خطأ") {
        current = "0";
        fresh = false;
      } else {
        current = current.length > 1
          ? current.slice(0, -1)
          : "0";

        if (current === "-") current = "0";
      }

      show();
    }

    function percent() {
      if (current === "خطأ") return;

      current = clean(Number(current) / 100) ?? "0";
      fresh = true;
      show();
    }

    function decimal() {
      if (fresh || current === "خطأ") {
        current = "0.";
        fresh = false;
      } else if (!current.includes(".")) {
        current += ".";
      }

      show();
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.num !== undefined) {
        number(button.dataset.num);
      } else if (button.dataset.op) {
        chooseOperator(button.dataset.op);
      } else {
        const action = button.dataset.action;

        if (action === "clear") clearAll();
        if (action === "delete") removeLast();
        if (action === "percent") percent();
        if (action === "decimal") decimal();
        if (action === "equals") equals();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) {
        number(event.key);
      } else if (event.key === ".") {
        decimal();
      } else if (["+", "-", "*", "/"].includes(event.key)) {
        chooseOperator(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        equals();
      } else if (event.key === "Backspace") {
        removeLast();
      } else if (event.key === "Escape") {
        clearAll();
      } else if (event.key === "%") {
        percent();
      }
    });
  </script>
</body>
</html>
